<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6df5">
<meta name="description" content="李云 · 影像部竞选作品集：影像拍摄、后期制作与党建宣传。">
<title>李云 · 影像部竞选作品集</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('liyun-theme');
    if(!t){ t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
/* ===================== Design Tokens ===================== */
:root{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#eef1f8;
  --text:#131922;
  --muted:#5c6779;
  --line:rgba(19,25,34,.10);
  --primary:#4f6df5;
  --primary-2:#7b5cf0;
  --primary-soft:rgba(79,109,245,.10);
  --accent:#e8a33d;
  --accent-soft:rgba(232,163,61,.14);
  --nav-bg:rgba(255,255,255,.78);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  --shadow-md:0 10px 34px rgba(16,24,40,.10);
  --shadow-lg:0 20px 56px rgba(16,24,40,.16);
  --radius:18px;
  --radius-sm:12px;
}
[data-theme="dark"]{
  --bg:#0b1016;
  --surface:#141b24;
  --surface-2:#1b242f;
  --text:#e8eef8;
  --muted:#8f9cb0;
  --line:rgba(255,255,255,.09);
  --primary:#7d93ff;
  --primary-2:#a08cff;
  --primary-soft:rgba(125,147,255,.14);
  --accent:#f0b862;
  --accent-soft:rgba(240,184,98,.12);
  --nav-bg:rgba(11,16,22,.78);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --shadow-md:0 12px 38px rgba(0,0,0,.48);
  --shadow-lg:0 22px 62px rgba(0,0,0,.62);
}

/* ===================== Base ===================== */
*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  scroll-padding-top:88px;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(880px 520px at 4% -6%, var(--primary-soft), transparent 60%),
    radial-gradient(720px 460px at 104% 2%, var(--accent-soft), transparent 58%);
  background-attachment:fixed;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  transition:background-color .28s ease, color .28s ease;
}
img,video{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit}
::selection{background:var(--primary);color:#fff}

.skip{
  position:absolute;left:-9999px;top:0;z-index:999;
  background:var(--primary);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;
}
.skip:focus{left:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:8px}

.wrap{max-width:1140px;margin:0 auto;padding:0 22px}

/* ===================== Nav ===================== */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:80;
  background:var(--nav-bg);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid transparent;
  transition:border-color .22s ease, box-shadow .22s ease;
}
.nav.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 26px rgba(16,24,40,.07)}
.nav-inner{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;box-shadow:0 8px 20px rgba(79,109,245,.34);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text b{font-size:15px;letter-spacing:.02em}
.brand-text i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  padding:7px 13px;border-radius:10px;font-size:13.5px;color:var(--muted);
  white-space:nowrap;transition:color .18s ease, background .18s ease;
}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--primary-soft)}
.nav-actions{display:flex;gap:8px;margin-left:8px;flex:0 0 auto}
.icon-btn{
  width:37px;height:37px;border-radius:12px;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:transform .18s ease, color .18s ease, border-color .18s ease;
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-2px)}
.ico-moon{display:none}
[data-theme="dark"] .ico-sun{display:none}
[data-theme="dark"] .ico-moon{display:block}

/* ===================== Hero ===================== */
.hero{padding:122px 0 58px;position:relative}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(640px 360px at 24% 24%, #000, transparent 72%);
  mask-image:radial-gradient(640px 360px at 24% 24%, #000, transparent 72%);
}
.hero-inner{
  position:relative;
  display:grid;grid-template-columns:1.5fr .8fr;gap:56px;align-items:center;
}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 14px;border-radius:999px;
  background:var(--primary-soft);color:var(--primary);
  font-size:12.5px;font-weight:600;letter-spacing:.02em;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hero h1{
  margin:16px 0 10px;
  font-size:clamp(38px,5.6vw,58px);
  line-height:1.03;letter-spacing:-.028em;font-weight:750;
  background:linear-gradient(118deg,var(--text) 24%,var(--primary) 90%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.hero-sub{margin:0 0 18px;color:var(--muted);font-size:14.5px;letter-spacing:.012em}
.hero-desc{margin:0;color:var(--muted);font-size:14.5px;line-height:1.92;max-width:56ch}
.badges{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:24px 0 0;list-style:none}
.badge{
  font-size:12.5px;padding:5px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  transition:transform .2s ease, color .2s ease, border-color .2s ease;
}
.badge:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-2px)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 21px;border-radius:13px;font-size:14px;font-weight:500;
  cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--primary)}
.btn:active{transform:translateY(0)}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;border-color:transparent;
  box-shadow:0 10px 26px rgba(79,109,245,.30);
}
.btn-primary:hover{box-shadow:0 16px 38px rgba(79,109,245,.42);border-color:transparent}

.hero-card{
  background:var(--surface);border:1px solid var(--line);border-radius:26px;
  padding:26px;box-shadow:var(--shadow-md);
  display:flex;flex-direction:column;align-items:center;gap:20px;
}
.avatar{
  width:132px;height:132px;border-radius:50%;padding:3px;flex:0 0 auto;
  background:conic-gradient(from 210deg,var(--primary),var(--primary-2),var(--accent),var(--primary));
  box-shadow:0 14px 34px rgba(79,109,245,.26);
}
.avatar>span{
  width:100%;height:100%;border-radius:50%;
  background:var(--surface-2);display:grid;place-items:center;color:var(--primary);
}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin:0}
.facts>div{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:13px;padding:10px 13px;
}
.facts dt{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.facts dd{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.01em}

/* ===================== Section ===================== */
.section{padding:64px 0}
.sec-head{margin-bottom:22px}
.sec-head h2{
  margin:0 0 8px;font-size:21px;font-weight:700;letter-spacing:.012em;
  display:flex;align-items:center;gap:10px;
}
.sec-head h2::before{
  content:"";width:4px;height:19px;border-radius:3px;
  background:linear-gradient(180deg,var(--primary),var(--accent));
}
.sec-head p{margin:0;color:var(--muted);font-size:13.5px}

/* ===================== Tabs ===================== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:8px 18px;border-radius:999px;font-size:13.5px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:color .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
}
.tab:hover{color:var(--text);border-color:var(--primary);transform:translateY(-1px)}
.tab[aria-selected="true"]{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;border-color:transparent;
  box-shadow:0 9px 22px rgba(79,109,245,.30);
}

/* ===================== Grid & Cards ===================== */
.grid{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);cursor:pointer;
  animation:cardIn .52s cubic-bezier(.2,.7,.3,1) backwards;
  transition:transform .24s cubic-bezier(.2,.7,.3,1), box-shadow .24s ease, border-color .24s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-6px);
  box-shadow:var(--shadow-lg);
  border-color:transparent;
}
.thumb{
  position:relative;aspect-ratio:4/3;overflow:hidden;
  background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));
}
.thumb img,.thumb video{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s cubic-bezier(.2,.7,.3,1);
  background:transparent;
}
.card:hover .thumb img{transform:scale(1.07)}
.thumb.is-fallback{display:grid;place-items:center}
.thumb.is-fallback::after{
  content:attr(data-name);
  font-size:12px;color:var(--muted);opacity:.8;padding:0 14px;text-align:center;
  word-break:break-all;line-height:1.6;
}
.play{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  background:rgba(8,12,20,.24);transition:background .24s ease;
}
.play svg{width:48px;height:48px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.card:hover .play{background:rgba(8,12,20,.06)}
.vtag{
  position:absolute;top:10px;right:10px;z-index:2;
  font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:3px 9px;border-radius:999px;
  background:rgba(10,14,22,.62);color:#fff;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.card-body{padding:15px 17px 17px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-body h3{margin:0;font-size:15.5px;font-weight:650;letter-spacing:.012em}
.card-body p{margin:0;font-size:13px;line-height:1.68;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:9px}
.tag{
  font-size:11.5px;padding:2px 10px;border-radius:999px;
  background:var(--primary-soft);color:var(--primary);font-weight:500;
}

/* ===================== Skills ===================== */
.skill-groups{
  display:grid;gap:20px;
  grid-template-columns:repeat(auto-fit,minmax(292px,1fr));
}
.skill-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:24px 24px 16px;box-shadow:var(--shadow-sm);
}
.skill-card h3{
  margin:0 0 20px;font-size:15px;font-weight:650;
  display:flex;align-items:center;gap:9px;
}
.skill-card h3::before{
  content:"";width:8px;height:8px;border-radius:3px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
}
.skill-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-bottom:16px}
.skill-name{font-size:13.5px;line-height:1.4}
.skill-val{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--primary-soft);overflow:hidden}
.bar>i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:width 1.1s cubic-bezier(.2,.7,.3,1);
}

/* ===================== Contact ===================== */
.contact-card{
  display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between;
  padding:32px 34px;border-radius:24px;border:1px solid var(--line);
  background:linear-gradient(135deg,var(--primary-soft),transparent 62%),var(--surface);
  box-shadow:var(--shadow-sm);
}
.contact-card h2{margin:0 0 7px;font-size:19px;letter-spacing:.012em}
.contact-card p{margin:0;color:var(--muted);font-size:13.5px}
.contact-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ===================== Footer ===================== */
footer{
  margin-top:28px;padding:36px 0 46px;border-top:1px solid var(--line);
  text-align:center;color:var(--muted);font-size:12.5px;
}
footer p{margin:4px 0}
footer .muted{opacity:.82}

/* ===================== To Top ===================== */
#toTop{
  position:fixed;right:20px;bottom:24px;z-index:70;
  width:46px;height:46px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--primary);
  display:grid;place-items:center;box-shadow:var(--shadow-md);
  opacity:0;pointer-events:none;transform:translateY(12px);
  transition:opacity .24s ease, transform .24s ease, box-shadow .24s ease;
}
#toTop.show{opacity:1;pointer-events:auto;transform:none}
#toTop:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}

/* ===================== Toast ===================== */
#toast{
  position:fixed;left:50%;bottom:36px;z-index:400;
  transform:translate(-50%,16px);
  background:var(--text);color:var(--bg);
  padding:10px 21px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;max-width:90vw;text-align:center;
  transition:opacity .24s ease, transform .24s ease;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===================== Lightbox ===================== */
.lb{
  position:fixed;inset:0;z-index:300;display:none;
  align-items:center;justify-content:center;padding:26px;
  background:rgba(5,8,13,.9);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:lbIn .22s ease;
}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lb.open{display:flex}
.lb-figure{margin:0;display:flex;flex-direction:column;gap:15px;align-items:center;max-width:min(1060px,92vw)}
.lb-media img,.lb-media video{
  max-width:100%;max-height:71vh;border-radius:15px;display:block;background:#0a0e14;
  box-shadow:0 26px 74px rgba(0,0,0,.65);
}
.lb-figure figcaption{
  color:rgba(255,255,255,.92);text-align:center;font-size:13.5px;
  display:flex;flex-direction:column;gap:5px;max-width:62ch;
}
.lb-figure figcaption strong{font-size:15.5px;letter-spacing:.02em;font-weight:650}
.lb-figure figcaption span{color:rgba(255,255,255,.62);line-height:1.65}
.lb-close,.lb-nav{
  position:fixed;border-radius:50%;cursor:pointer;color:#fff;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);
  display:grid;place-items:center;
  transition:background .18s ease, transform .18s ease;
}
.lb-close{top:20px;right:20px;width:44px;height:44px}
.lb-close:hover{background:rgba(255,255,255,.22);transform:rotate(90deg)}
.lb-nav{top:50%;width:48px;height:48px;font-size:27px;line-height:1;transform:translateY(-50%)}
.lb-nav:hover{background:rgba(255,255,255,.22)}
.lb-prev{left:18px}
.lb-next{right:18px}

/* ===================== Reveal ===================== */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}

/* ===================== Responsive ===================== */
@media (max-width:920px){
  .hero{padding-top:106px}
  .hero-inner{grid-template-columns:1fr;gap:32px}
  .hero-card{order:-1;flex-direction:row;align-items:center;gap:22px}
  .avatar{width:106px;height:106px}
  .hero-desc{max-width:none}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .brand-text i{display:none}
  .nav-links a{padding:6px 10px;font-size:12.5px}
  .section{padding:48px 0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
  .card-body{padding:12px 13px 14px}
  .card-body h3{font-size:14px}
  .card-body p{font-size:12.5px}
  .contact-card{padding:26px 22px}
  .hero-card{flex-direction:column}
  #toTop{right:14px;bottom:16px}
  .lb{padding:14px}
  .lb-nav{width:40px;height:40px;font-size:23px}
  .lb-prev{left:8px}
  .lb-next{right:8px}
}
@media (max-width:400px){
  .grid{grid-template-columns:1fr}
}

/* ===================== Reduced motion ===================== */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .reveal{opacity:1;transform:none}
  .thumb img{transition:none !important}
}

/* ===================== Print ===================== */
@media print{
  @page{margin:12mm}
  html,body{
    background:#fff !important;background-image:none !important;color:#111 !important;
  }
  .nav,#toTop,.tabs,.lb,#toast,.skip,.hero-actions,.contact-actions,.play,.vtag{display:none !important}
  .hero{padding:0 0 14px !important}
  .hero::before{display:none !important}
  .section{padding:14px 0 !important}
  .wrap{max-width:100%;padding:0 !important}
  .hero-inner{grid-template-columns:1fr 250px !important;gap:18px !important}
  h1{-webkit-text-fill-color:#111 !important;color:#111 !important;background:none !important;font-size:29px !important}
  .card,.skill-card,.hero-card,.contact-card{
    box-shadow:none !important;border:1px solid #d5d8de !important;
    background:#fff !important;break-inside:avoid;
  }
  .card{animation:none !important;transform:none !important}
  .grid{grid-template-columns:repeat(3,1fr) !important;gap:10px !important}
  .thumb{aspect-ratio:4/3}
  .card-body p,.hero-desc,.sec-head p,.badge,.skill-name{color:#555 !important}
  .tag{background:#eef1ff !important;color:#3344aa !important}
  .bar{background:#e8eaf0 !important}
  .bar>i{background:#3344aa !important}
  .lb{display:none !important}
}
</style>
</head>
<body>

<a class="skip" href="#main">跳转到主要内容</a>

<!-- ===================== NAV ===================== -->
<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="#hero" aria-label="李云 · 返回顶部">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h3l1.4-2h7.2L17 8h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>李云</b>
        <i>影像部竞选作品集</i>
      </span>
    </a>

    <nav class="nav-links" aria-label="主导航">
      <a href="#hero">简介</a>
      <a href="#works">作品集</a>
      <a href="#skills">技能</a>
      <a href="#contact">联系</a>

      /* ---------- 视频短片 ---------- */
      { f:'trip.mp4',        t:'旅途拾光',     d:'一段在路上的记录，风、光与移动的风景。',   c:'video', tags:['短片','旅行'], video:true },
      { f:'starts-1.mp4',    t:'星野起始 · 壹', d:'夜色流动、光影交替的一段记录。',           c:'video', tags:['短片','夜景'], video:true },
      { f:'starts-2.mp4',    t:'星野起始 · 贰', d:'镜头缓慢推移，把静谧收进画面。',           c:'video', tags:['短片','运镜'], video:true },
      { f:'starts-3.mp4',    t:'星野起始 · 叁', d:'光与影的节奏，是夜的呼吸方式。',           c:'video', tags:['短片','光影'], video:true },
      { f:'starts-4.mp4',    t:'星野起始 · 肆', d:'一段流动的夜，作为本组的收束。',           c:'video', tags:['短片','氛围'], video:true }
    ]
  };

  const CATS = [
    { id:'all',     label:'全部' },
    { id:'city',    label:'城市光影' },
    { id:'time',    label:'晨昏夜色' },
    { id:'journey', label:'行旅途中' },
    { id:'video',   label:'视频短片' }
  ];

  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="11" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.85)" stroke-width="1.2"/>' +
    '<path d="M10 8.3 16.2 12 10 15.7V8.3Z" fill="#fff"/></svg>';

  /* ============================================================
     工具函数
     ============================================================ */
  const $  = function(s, r){ return (r || document).querySelector(s); };
  const $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function h(tag, attrs, html){
    const n = document.createElement(tag);
    if(attrs){
      for(const k in attrs){
        if(!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        const v = attrs[k];
        if(v === null || v === undefined || v === false) continue;
        if(k === 'class') n.className = v;
        else if(k === 'text') n.textContent = v;
        else n.setAttribute(k, v === true ? '' : v);
      }
    }
    if(html !== null && html !== undefined) n.innerHTML = html;
    return n;
  }

  const reduceMotion = !!(window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* 图片加载：自动尝试 .JPG / .jpg 两种大小写（防 Netlify 大小写敏感） */
  function buildImage(src, alt, onFail){
    const img = document.createElement('img');
    img.alt = alt;
    img.loading = 'lazy';
    img.decoding = 'async';

    const list = [src];
    const m = src.match(/\.(jpe?g|png|webp)$/i);
    if(m){
      const base = src.slice(0, src.length - m[0].length);
      const ext  = m[0];
      const swapped = (ext === ext.toUpperCase()) ? ext.toLowerCase() : ext.toUpperCase();
      list.push(base + swapped);
    }

    let i = 0;
    img.addEventListener('error', function(){
      i++;
      if(i < list.length){ img.src = list[i]; }
      else if(typeof onFail === 'function'){ onFail(); }
    });
    img.src = list[0];
    return img;
  }

  /* ============================================================
     Hero 渲染
     ============================================================ */
  function renderHero(){
    const desc = $('#heroDesc');
    if(desc) desc.textContent = resume.summary;

    const badgeBox = $('#badges');
    if(badgeBox && resume.badges && resume.badges.length){
      const frag = document.createDocumentFragment();
      resume.badges.forEach(function(b){ frag.appendChild(h('li', { 'class': 'badge' }, b)); });
      badgeBox.appendChild(frag);
    } else if(badgeBox){
      badgeBox.remove();
    }

    const facts = $('#facts');
    if(facts && resume.facts && resume.facts.length){
      resume.facts.forEach(function(f){
        const box = h('div');
        box.appendChild(h('dt', {}, f.k));
        box.appendChild(h('dd', {}, f.v));
        facts.appendChild(box);
      });
    } else if(facts){
      facts.remove();
    }
  }

  /* ============================================================
     作品渲染
     ============================================================ */
  let cardEls = [];

  function renderWorks(){
    const grid = $('#workGrid');
    if(!grid || !resume.works || !resume.works.length){
      const sec = $('#works');
      if(sec) sec.remove();
      return;
    }

    const frag = document.createDocumentFragment();
    cardEls = [];

    resume.works.forEach(function(w, i){
      const card = h('article', { 'class': 'card', 'data-cat': w.c || 'all' });
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', (w.video ? '播放视频：' : '查看作品：') + w.t);
      if(!reduceMotion) card.style.animationDelay = Math.min(i * 45, 500) + 'ms';

      const thumb = h('div', { 'class': 'thumb' });

      if(w.video){
        const v = document.createElement('video');
        v.src = w.f;
        v.muted = true;
        v.loop = true;
        v.preload = 'metadata';
        v.setAttribute('muted', '');
        v.setAttribute('playsinline', '');
        v.setAttribute('aria-hidden', 'true');
        thumb.appendChild(v);
        thumb.appendChild(h('span', { 'class': 'play' }, PLAY_SVG));
        thumb.appendChild(h('span', { 'class': 'vtag' }, '视频'));

        card.addEventListener('mouseenter', function(){
          if(reduceMotion) return;
          const p = v.play();
          if(p && p.catch) p.catch(function(){});
        });
        card.addEventListener('mouseleave', function(){
          v.pause();
          try{ v.currentTime = 0; }catch(e){}
        });
      } else {
        const img = buildImage(w.f, w.t + ' —— ' + w.d, function(){
          thumb.classList.add('is-fallback');
          thumb.setAttribute('data-name', w.f);
        });
        thumb.appendChild(img);
      }

      const body = h('div', { 'class': 'card-body' });
      body.appendChild(h('h3', {}, w.t));
      body.appendChild(h('p', {}, w.d));

      if(w.tags && w.tags.length){
        const tags = h('div', { 'class': 'tags' });
        w.tags.forEach(function(t){ tags.appendChild(h('span', { 'class': 'tag' }, t)); });
        body.appendChild(tags);
      }

      card.appendChild(thumb);
      card.appendChild(body);

      card.addEventListener('click', function(){ openLightbox(i); });
      card.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
          e.preventDefault();
          openLightbox(i);
        }
      });

      frag.appendChild(card);
      cardEls.push(card);
    });

    grid.appendChild(frag);
  }

  /* ============================================================
     Tabs
     ============================================================ */
  let tabEls = [];

  function renderTabs(){
    const tl = $('#tablist');
    const panel = $('#workPanel');
    if(!tl || !panel) return;

    CATS.forEach(function(c, i){
      const b = h('button', {
        'class': 'tab',
        'role': 'tab',
        'type': 'button',
        'id': 'tab-' + c.id,
        'data-cat': c.id,
        'aria-selected': i === 0 ? 'true' : 'false',
        'aria-controls': 'workPanel'
      }, c.label);
      b.tabIndex = i === 0 ? 0 : -1;
      b.addEventListener('click', function(){ activateTab(c.id, false); });
      tl.appendChild(b);
      tabEls.push(b);
    });

    panel.setAttribute('aria-labelledby', 'tab-' + CATS[0].id);

    tl.addEventListener('keydown', function(e){
      let idx = tabEls.findIndex(function(t){ return t.getAttribute('aria-selected') === 'true'; });
      if(idx < 0) idx = 0;

      if(e.key === 'ArrowRight' || e.key === 'Right'){ idx = (idx + 1) % tabEls.length; }
      else if(e.key === 'ArrowLeft' || e.key === 'Left'){ idx = (idx - 1 + tabEls.length) % tabEls.length; }
      else if(e.key === 'Home'){ idx = 0; }
      else if(e.key === 'End'){ idx = tabEls.length - 1; }
      else { return; }
      e.preventDefault();
      activateTab(tabEls[idx].getAttribute('data-cat'), true);
    });
  }

  function activateTab(catId, focusTab){
    tabEls.forEach(function(t){
      const on = t.getAttribute('data-cat') === catId;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if(on && focusTab) t.focus();
    });
    const panel = $('#workPanel');
    if(panel) panel.setAttribute('aria-labelledby', 'tab-' + catId);
    cardEls.forEach(function(c){
      c.style.display = (catId === 'all' || c.getAttribute('data-cat') === catId) ? '' : 'none';
    });
  }

  /* ============================================================
     技能渲染
     ============================================================ */
  function renderSkills(){
    const box = $('#skillGroups');
    if(!box || !resume.skills || !resume.skills.length){
      const sec = $('#skills');
      if(sec) sec.remove();
      return;
    }

    resume.skills.forEach(function(g){
      const card = h('section', { 'class': 'skill-card reveal' });
      card.appendChild(h('h3', {}, g.group));

      g.items.forEach(function(it){
        const row = h('div', { 'class': 'skill-row' });
        row.appendChild(h('span', { 'class': 'skill-name' }, it.name));
        row.appendChild(h('span', { 'class': 'skill-val' }, it.level + '%'));

        const bar = h('span', { 'class': 'bar' });
        const fill = document.createElement('i');
        fill.setAttribute('data-level', String(it.level));
        bar.appendChild(fill);
        row.appendChild(bar);

        card.appendChild(row);
      });

      box.appendChild(card);
    });

     ============================================================ */

  let lastFocused = null;

  function openLightbox(i){
    const w = resume.works[i];

    const lb = $('#lightbox');
    const media = $('#lbMedia');
    const cap = $('#lbCap');
    if(!lb || !media || !cap) return;

    lbIndex = i;
    lastFocused = document.activeElement;
    media.innerHTML = '';

    if(w.video){
      const v = document.createElement('video');
      v.src = w.f;
      v.controls = true;
      v.autoplay = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('preload', 'metadata');
      media.appendChild(v);
    } else {
      const img = buildImage(w.f, w.t, function(){
        media.innerHTML = '<div style="color:rgba(255,255,255,.7);font-size:13px;padding:40px 20px;text-align:center;">图片加载失败：' +
          w.f + '<br>请确认文件已上传且名称大小写一致</div>';
      });
      media.appendChild(img);
    }

    cap.innerHTML = '';
    const strong = document.createElement('strong');
    strong.textContent = w.t;
    const span = document.createElement('span');
    span.textContent = w.d;
    cap.appendChild(strong);
    cap.appendChild(span);

    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    const closeBtn = $('#lbClose');
    if(closeBtn) closeBtn.focus();
  }

  function closeLightbox(){
    const lb = $('#lightbox');
    const media = $('#lbMedia');
    if(!lb) return;
    lb.classList.remove('open');
    if(media) media.innerHTML = '';
    lbIndex = -1;
    document.body.style.overflow = '';
    if(lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    lastFocused = null;
  }

  function navigateLightbox(dir){
    const visible = [];
    cardEls.forEach(function(c, i){ if(c.style.display !== 'none') visible.push(i); });
    if(!visible.length) return;
    let pos = visible.indexOf(lbIndex);
    if(pos === -1) pos = 0;
    pos = (pos + dir + visible.length) % visible.length;
    openLightbox(visible[pos]);
  }

  function setupLightbox(){
    const lb = $('#lightbox');
    if(!lb) return;
    $('#lbClose').addEventListener('click', closeLightbox);
    $('#lbPrev').addEventListener('click', function(){ navigateLightbox(-1); });
    $('#lbNext').addEventListener('click', function(){ navigateLightbox(1); });
    lb.addEventListener('click', function(e){ if(e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', function(e){
      if(!lb.classList.contains('open')) return;
      if(e.key === 'Escape') closeLightbox();
      else if(e.key === 'ArrowRight') navigateLightbox(1);
      else if(e.key === 'ArrowLeft') navigateLightbox(-1);
    });
  }

  /* ============================================================
     主题 / 打印 / 返回顶部 / 联系方式
     ============================================================ */
  function setupTheme(){
    const btn = $('#themeBtn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('liyun-theme', next); }catch(e){}
    });
  }

  let printPrev = null;

  function setupPrint(){
    const btn = $('#printBtn');
    if(btn){
      btn.addEventListener('click', function(){
        try{ window.print(); }catch(e){}
      });
    }
    window.addEventListener('beforeprint', function(){
      if(!cardEls.length) return;
      printPrev = cardEls.map(function(c){ return c.style.display; });
      cardEls.forEach(function(c){ c.style.display = ''; });
    });
    window.addEventListener('afterprint', function(){
      if(!printPrev) return;
      cardEls.forEach(function(c, i){ c.style.display = printPrev[i] || ''; });
      printPrev = null;
    });
  }

  function setupToTop(){
    const btn = $('#toTop');
    const nav = $('#nav');
    if(!btn) return;
    btn.addEventListener('click', function(){
      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    });
    const links = $$('.nav-links a');
    const sections = links.map(function(a){ return $(a.getAttribute('href')); });

    function onScroll(){
      const y = window.pageYOffset || document.documentElement.scrollTop;
      btn.classList.toggle('show', y > 420);
      if(nav) nav.classList.toggle('scrolled', y > 8);

      let active = 0;
      sections.forEach(function(sec, i){
        if(sec && sec.offsetTop - 130 <= y) active = i;
      });
      links.forEach(function(a, i){ a.classList.toggle('active', i === active); });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  function toast(msg){
    let t = $('#toast');
    if(!t){
      t = document.createElement('div');
      t.id = 'toast';
      t.setAttribute('role', 'status');
      t.setAttribute('aria-live', 'polite');
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  function copyEmail(){
    const email = resume.emailUser + '@' + resume.emailDomain;

    function fallback(){
      const ta = document.createElement('textarea');
      ta.value = email;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, email.length);
      let ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
      document.body.removeChild(ta);
      toast(ok ? ('邮箱已复制：' + email) : ('邮箱：' + email));
    }

    if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
      navigator.clipboard.writeText(email).then(function(){
        toast('邮箱已复制：' + email);
      }).catch(fallback);
    } else {
      fallback();
    }
  }

  function setupContact(){
    $$('a[data-tel]').forEach(function(a){ a.href = 'tel:' + resume.phone; });
    $$('[data-copy-email]').forEach(function(b){ b.addEventListener('click', copyEmail); });
  }

  function setupFooter(){
    const y = $('#year');
    const u = $('#updated');
    if(y) y.textContent = String(new Date().getFullYear());
    if(u){
      const d = new Date();
      const pad = function(n){ return n < 10 ? '0' + n : String(n); };
      u.textContent = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    }
  }

  /* ============================================================
     进入动画
     ============================================================ */
  function setupObservers(){
    if(!('IntersectionObserver' in window)){
      $$('.reveal').forEach(function(el){ el.classList.add('in'); });
      $$('.bar > i').forEach(function(f){ f.style.width = (f.getAttribute('data-level') || 0) + '%'; });
      return;
    }

    const revealIO = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          en.target.classList.add('in');
          revealIO.unobserve(en.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

    $$('.reveal').forEach(function(el){ revealIO.observe(el); });

    const barIO = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          const fill = en.target.querySelector('i');
          if(fill){
            const lv = fill.getAttribute('data-level') || 0;
            requestAnimationFrame(function(){ fill.style.width = lv + '%'; });
          }
          barIO.unobserve(en.target);
        }
      });
    }, { threshold: 0.35 });

    $$('.skill-row').forEach(function(r){ barIO.observe(r); });
  }

  /* ============================================================
     初始化
     ============================================================ */
  function init(){
    renderHero();
    renderWorks();
    renderTabs();
    renderSkills();
    setupLightbox();
    setupTheme();
    setupPrint();
    setupToTop();
    setupContact();
    setupFooter();
    setupObservers();

    // 首屏 tab 激活
    activateTab(CATS[0].id, false);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
